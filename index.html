<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc">
    <div class="screen">
      <div id="history" class="history"></div>
      <div id="display" class="display">0</div>
    </div>

    <div class="keys">
      <button class="key op" data-action="sqrt">√</button>
     <button class="key op" data-action="power">xʸ</button>
      <button data-action="delete" class="key del">DEL</button>
      <button data-action="clear" class="key del">C</button>
      
           
      <button data-action="percent" class="key op">%</button>

      <button class="key op" data-value="(">(</button>
      <button class="key op" data-value=")">)</button>
      <button data-action="operator" data-value="/" class="key op">÷</button>

       
      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button data-action="operator" data-value="*" class="key op">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button data-action="operator" data-value="-" class="key op">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button data-action="operator" data-value="+" class="key op">+</button>

      
      <button class="key zero" data-value="0">0</button>
      <button class="key op" data-value=".">.</button>
       <button data-action="posneg" class="key op">±</button>
      <button data-action="calculate" class="key eq">=</button>
      
     
</div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
